name: "Escape from Tarkov"
game_id: "escapefromtarkov"
version: "1.0"

capture:
  fps: 60
  roi: null  # Full screen
  monitor: 0
  format: "RGB"

ai:
  model: "yolov8m"  # Larger model for complex environments
  confidence: 0.72
  iou_threshold: 0.40
  device: "auto"
  batch_size: 2

ocr:
  engine: "easyocr"
  language: "eng"
  zones:
    health: [40, 800, 200, 50]
    hydration: [40, 855, 90, 30]
    energy: [135, 855, 90, 30]
    ammo: [1720, 940, 150, 50]
    time: [1800, 30, 100, 40]

rules:
  - name: "scav_detected"
    state: "exploration"
    priority: 8
    conditions:
      - "enemy.type == 'scav'"
      - "enemy.distance < 200"
    actions:
      - type: "emit"
        payload: "SCAV_NEARBY"
    cooldown: 2.0

  - name: "pmc_detected"
    state: "*"
    priority: 10
    conditions:
      - "enemy.type == 'player'"
      - "enemy.distance < 250"
    actions:
      - type: "emit"
        payload: "PMC_THREAT"
    cooldown: 1.5

  - name: "heavy_bleeding"
    state: "*"
    priority: 10
    conditions:
      - "player.bleeding == 'heavy'"
    actions:
      - type: "emit"
        payload: "HEAVY_BLEEDING"
    cooldown: 1.0

  - name: "low_health_critical"
    state: "*"
    priority: 10
    conditions:
      - "player.hp < 40"
    actions:
      - type: "emit"
        payload: "CRITICAL_HEALTH"
    cooldown: 2.0

  - name: "dehydration_warning"
    state: "*"
    priority: 7
    conditions:
      - "player.hydration < 20"
    actions:
      - type: "emit"
        payload: "LOW_HYDRATION"
    cooldown: 30.0

  - name: "energy_warning"
    state: "*"
    priority: 6
    conditions:
      - "player.energy < 20"
    actions:
      - type: "emit"
        payload: "LOW_ENERGY"
    cooldown: 30.0

  - name: "extract_available"
    state: "exploration"
    priority: 7
    conditions:
      - "extraction.distance < 100"
      - "extraction.open == true"
      - "enemy.distance > 300"
    actions:
      - type: "emit"
        payload: "SAFE_EXTRACT"
    cooldown: 5.0

  - name: "time_warning"
    state: "*"
    priority: 8
    conditions:
      - "raid.time_remaining < 300"  # 5 minutes
    actions:
      - type: "emit"
        payload: "TIME_WARNING"
    cooldown: 60.0

  - name: "ambush_risk"
    state: "exploration"
    priority: 8
    conditions:
      - "location.type == 'chokepoint'"
      - "movement.speed > 0.5"
    actions:
      - type: "emit"
        payload: "SLOW_DOWN"
    cooldown: 10.0

  - name: "low_ammo"
    state: "combat"
    priority: 9
    conditions:
      - "player.ammo < 10"
    actions:
      - type: "emit"
        payload: "LOW_AMMO"
    cooldown: 3.0

  - name: "boss_area"
    state: "*"
    priority: 9
    conditions:
      - "location.boss_area == true"
      - "enemy.detected == true"
    actions:
      - type: "emit"
        payload: "BOSS_DETECTED"
    cooldown: 5.0

hud:
  theme: "tactical_minimal"
  show_proximity_rings: true
  show_direction_arrows: true
  show_health_warnings: true
  show_ammo_counter: true
  show_status_effects: true
  opacity: 0.65
  scale: 0.90

performance:
  mode: "QUALITY"  # Tarkov benefits from quality over speed
  max_latency_ms: 50
  frame_skip: true
  adaptive_quality: true

custom:
  game_notes: "Escape from Tarkov - Hardcore tactical shooter. Focus on survival, health management, and extract awareness"
  developer: "Battlestate Games"
  genre: "Hardcore Extraction Shooter"
  release_year: 2017
  anti_cheat: "BattlEye"
  difficulty: "Very Hard"

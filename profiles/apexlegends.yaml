name: Apex Legends
game_id: apexlegends
version: '1.0'
capture:
  fps: 60
  roi: null
  monitor: 0
  format: RGB
ai:
  model: yolov8s
  confidence: 0.68
  iou_threshold: 0.42
  device: auto
  batch_size: 2
ocr:
  engine: easyocr
  language: eng
  zones:
    health:
    - 50
    - 880
    - 180
    - 35
    shield:
    - 50
    - 920
    - 180
    - 35
    ammo:
    - 1720
    - 930
    - 150
    - 45
    abilities:
    - 900
    - 920
    - 100
    - 60
    squad:
    - 1750
    - 50
    - 150
    - 120
rules:
- name: enemy_squad_detected
  state: exploration
  priority: 9
  conditions:
  - field: enemy.count
    operator: '>='
    value: 2
  - field: enemy.distance
    operator: <
    value: 250
  actions:
  - type: emit
    payload: ENEMY_SQUAD
  cooldown: 2.0
- name: close_combat
  state: combat
  priority: 10
  conditions:
  - field: enemy.distance
    operator: <
    value: 80
  - field: enemy.threat_score
    operator: '>'
    value: 0.7
  actions:
  - type: emit
    payload: CLOSE_RANGE_COMBAT
  cooldown: 1.0
- name: shield_broken
  state: combat
  priority: 10
  conditions:
  - field: player.shield
    operator: <
    value: 10
  - field: state
    operator: ==
    value: combat
  actions:
  - type: emit
    payload: SHIELD_BROKEN
  cooldown: 2.0
- name: low_health
  state: '*'
  priority: 10
  conditions:
  - field: player.hp
    operator: <
    value: 35
  actions:
  - type: emit
    payload: LOW_HEALTH
  cooldown: 3.0
- name: third_party
  state: combat
  priority: 9
  conditions:
  - field: environment.total_enemies
    operator: '>='
    value: 4
  - field: combat_duration
    operator: '>'
    value: 20
  actions:
  - type: emit
    payload: THIRD_PARTY
  cooldown: 3.0
- name: ability_ready
  state: '*'
  priority: 6
  conditions:
  - field: abilities.ultimate
    operator: ==
    value: 100
  - field: enemy.distance
    operator: <
    value: 300
  actions:
  - type: emit
    payload: ULTIMATE_READY
  cooldown: 5.0
- name: ring_closing
  state: exploration
  priority: 8
  conditions:
  - field: ring.distance
    operator: <
    value: 400
  - field: ring.damage
    operator: '>'
    value: 5
  actions:
  - type: emit
    payload: RING_WARNING
  cooldown: 10.0
- name: low_ammo
  state: combat
  priority: 7
  conditions:
  - field: player.ammo
    operator: <
    value: 20
  actions:
  - type: emit
    payload: LOW_AMMO
  cooldown: 5.0
- name: knockdown_assist
  state: combat
  priority: 8
  conditions:
  - field: enemy.knocked
    operator: ==
    value: true
  - field: enemy.distance
    operator: <
    value: 150
  actions:
  - type: emit
    payload: FINISH_KNOCKED
  cooldown: 2.0
hud:
  theme: modern
  show_proximity_rings: true
  show_direction_arrows: true
  show_health_warnings: true
  show_ammo_counter: true
  show_ability_status: true
  opacity: 0.7
  scale: 0.85
performance:
  mode: PERFORMANCE
  max_latency_ms: 25
  frame_skip: false
  adaptive_quality: true
custom:
  game_notes: Apex Legends - Hero shooter BR. Focus on squad combat and ability tracking
  developer: Respawn Entertainment
  publisher: EA
  genre: Hero Battle Royale
  release_year: 2019
  anti_cheat: Easy Anti-Cheat
  max_players: 60
